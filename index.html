<!DOCTYPE html>
<html>
 
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/cc6f3ddc0c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
        <div id="sectionHome">
        <div class="bg-container">
            <div class="container">
                <div class="row">



                    <div class="col-12 d-flex flex-row justify-content-center">
                        <div class="shadow card mt-5">
                            <!-- Icon -->
                             <div class="d-flex flex-row justify-content-center"> 
                            <div class="login-icon-wrap text-center">
                                <i class="fas fa-user icon mt-2"></i>
                            </div>
                            </div>  

                            <!-- Heading -->
                            <h1 class="login-title text-center mt-3">Welcome Back!</h1>
                            <p class="login-subtitle text-center">Sign in to continue to your account</p>

                            <!-- Email -->
                            <div class="field text-center">
                                <label for="loginEmail" class="text-left">Email address</label>
                                <input type="email" id="loginEmail" placeholder="example@gmail.com" autocomplete="email" />
                                <div class="error-hint" id="emailErr">Please enter a valid email address.</div>
                            </div>



                            <!-- Password -->
                            

                               <div class="field">
                                <label for="loginPwd" class="text-left">Password</label>
                                <div class="pwd-wrap">
                                    <input type="password" id="loginPwd" placeholder="Enter your password" autocomplete="current-password" />
                                    <button class="toggle-eye" type="button" onclick="togglePwd('loginPwd', this)" aria-label="Show password"> 👁</button>

                                </div>
                                <div class="error-hint" id="pwdErr">Please enter your password.</div>
                            </div>

                            <!-- Forgot Password -->
                            <div class="forgot-link">
                                <a href="#">Forgot password?</a>
                            </div>

                            <!-- Login Button -->
                            <div class="mr-3 ml-3">
                                <button class="login-btn" onclick="handleLogin()">Sign In</button>
                            </div>

                            <!-- OR -->
                             <div class="d-flex flex-row justify-content-center"> 
                            <div class="or-sep text-center">OR</div>
                            </div>

                            <!-- Google Login -->
                            <div class="mr-3 ml-3">
                                <button class="google-btn">
                                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="google-img" />
                                    Continue with Google
                                </button>
                            </div>

                            <hr class="divider" />

                            <!-- Register link -->
                            <p class="register-link">
                                Don't have an account? <button class="button" onclick="display('sectionRegister')"> Register Now</button>




                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

     <div id="sectionRegister">
        <div class="bg-container">
            <div class="container">
                <div class="row">
                    <div class="col-12 d-flex flex-row justify-content-center">
                        <div class="card-1 mt-5 shadow-lg d-flex flex-column justify-content-between">
                            <div class="d-flex flex-row justify-content-start">
                                <div class="icon-card shadow-lg ml-2 mt-2">
                                    <i class="fa-solid fa-arrow-left iconm ml-1 mt-1" onclick="display('sectionHome')"></i>
                                </div>
                                <div>
                                    <h1 class="cre-head text-center ml-5">Create An Account</h1>
                                </div>
                            </div>


                            <!-- First Name & Last Name -->
                            <div class="row">
                                <div class="field-1 ml-4 text-left">
                                    <label for="fname">First name</label>
                                    <input type="text" id="fname" placeholder="First name" class="shadow-sm" autocomplete="given-name" />
                                </div>
                                <div class="field-1 ml-1 text-left">
                                    <label for="lname">Last name</label>
                                    <input type="text" id="lname" placeholder="Last name" class="shadow-sm" autocomplete="family-name" />
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="field-1 ml-2 mr-3 text-left">
                                <label for="email">Email address</label>
                                <input type="email" id="email" placeholder="example@gmail.com" class="shadow-sm" autocomplete="email" />
                            </div>

                            <!-- Mobile -->
                            <div class="field-1 ml-2 mr-3 text-left">
                                <label for="mobile">Mobile number</label>
                                <input type="tel" id="mobile" placeholder="+91 12345 67890" class="shadow-sm" autocomplete="tel" />
                            </div>

                            <!-- Create Password -->
                             <div class="field-1 ml-2 mr-3 text-left">
                                <label for="pwd-1">Create password</label>
                                <div class="pwd-wrap-1">
                                    <input type="password" id="pwd" placeholder="Min. 8 characters" class="shadow-sm" autocomplete="new-password" oninput="checkStrength(this.value)" />
                                    <button class="toggle-eye-1" type="button" onclick="togglePwd('pwd', this)" aria-label="Show password">
                                        &#128065;
                                    </button>
                                </div>
                                <div class="strength-bar ml-2 mr-3">
                                    <div class="strength-seg" id="s1"></div>
                                    <div class="strength-seg" id="s2"></div>
                                    <div class="strength-seg" id="s3"></div>
                                    <div class="strength-seg" id="s4"></div>
                                </div>
                                <div class="strength-label" id="slabel"></div>
                            </div>

                             <!-- Confirm Password -->
                            <div class="field ml-2 mr-3 text-left">
                                <label for="cpwd">Confirm password</label>
                                <div class="pwd-wrap">
                                    <input type="password" id="cpwd" placeholder="Re-enter password" class="shadow-sm" autocomplete="new-password" oninput="checkMatch()" />
                                    <button class="toggle-eye" type="button" onclick="togglePwd('cpwd', this)" aria-label="Show confirm password">
                                        &#128065;
                                    </button>
                                </div>
                                <div class="match-hint" id="matchHint"></div>
                            </div>

                            

                            <hr class="divider-1" />

                            <!-- Terms & Conditions -->
                            <div class="terms-row mt-3 ml-2">
                                <input type="checkbox" id="terms" onchange="toggleBtn()" />
                                <label for="terms">
                                    I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>
                                </label>
                            </div>

                            <!-- Button trigger modal -->
                            <div class="d-flex flex-row justify-content-center mb-3">
                                <button type="button" class="btn btn-primary mb-3" data-toggle="modal" data-target="#staticBackdrop">
                                    Create Account
                                </button>
                            </div>

                            <!-- Modal -->
                            <div class="modal fade" id="staticBackdrop" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="staticBackdropLabel">Account Created Successfully</h5>
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <div class="modal-body">
                                            <img src="https://img.magnific.com/premium-vector/account-successfully-createdregistration-successfulid-card-laptop-screen-concept_183665-1627.jpg" class="model-img text-center ml-5" />
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                            <button type="button" class="btn btn-primary" data-dismiss="modal" onclick="display('sectionHome')">Login</button>

                                        </div>
                                    </div>
                                </div>
                            </div>



                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

  <script>
        // Show / hide password
        function toggleLoginPwd() {
            const inp = document.getElementById('loginPwd');
            const btn = inp.nextElementSibling;
            if (inp.type === 'password') {
                inp.type = 'text';
                btn.textContent = '🙈';
            } else {
                inp.type = 'password';
                btn.textContent = '👁';
            }
        }

        // Login validation
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pwd = document.getElementById('loginPwd').value.trim();
            const emailErr = document.getElementById('emailErr');
            const pwdErr = document.getElementById('pwdErr');

            let valid = true;

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                emailErr.style.display = 'block';
                valid = false;
            } else {
                emailErr.style.display = 'none';
            }

            // Validate password
            if (!pwd) {
                pwdErr.style.display = 'block';
                valid = false;
            } else {
                pwdErr.style.display = 'none';
            }

            // Show modal if valid
            if (valid) {
                $('#loginModal').modal('show');
            }
        }
    </script>

      <script>
        function togglePwd(id, btn) {
            const inp = document.getElementById(id);
            if (inp.type === 'password') {
                inp.type = 'text';
                btn.textContent = '🙈';
            } else {
                inp.type = 'password';
                btn.textContent = '👁';
            }
        }

        function checkStrength(val) {
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const colors = ['', '#E24B4A', '#EF9F27', '#1D9E75', '#0F6E56'];
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

            for (let i = 1; i <= 4; i++) {
                document.getElementById('s' + i).style.backgroundColor =
                    i <= score ? colors[score] : '#e0e0e0';
            }

            const lbl = document.getElementById('slabel');
            lbl.textContent = val.length ? labels[score] : '';
            lbl.style.color = colors[score] || '#888888';
            checkMatch();
        }

        function checkMatch() {
            const p = document.getElementById('pwd').value;
            const c = document.getElementById('cpwd').value;
            const hint = document.getElementById('matchHint');
            if (!c) {
                hint.textContent = '';
                return;
            }
            if (p === c) {
                hint.textContent = '✓ Passwords match';
                hint.style.color = '#1D9E75';
            } else {
                hint.textContent = '✗ Passwords do not match';
                hint.style.color = '#E24B4A';
            }
        }

        function toggleBtn() {
            document.getElementById('submitBtn').disabled = !document.getElementById('terms').checked;
        }
    </script>
     <script type="text/javascript" src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/js/ccbp-ui-kit.js"></script>

</body>
</html>
